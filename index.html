}

</style>
<script>

document.addEventListener("DOMContentLoaded", function () {

  const WHATSAPP_NUMBER = "212684424055";

  const products = [
    {
      id: "cat-food",
      name: "طعام القطط",
      category: "cats",
      categoryName: "القطط",
      price: 45,
      icon: "🐱",
      description: "طعام مناسب للقطط للاستخدام اليومي."
    },
    {
      id: "cat-litter",
      name: "رمل القطط",
      category: "cats",
      categoryName: "القطط",
      price: 35,
      icon: "🐾",
      description: "رمل عملي للحفاظ على نظافة مكان القط."
    },
    {
      id: "dog-food",
      name: "طعام الكلاب",
      category: "dogs",
      categoryName: "الكلاب",
      price: 55,
      icon: "🐶",
      description: "وجبة مناسبة للكلاب للاستخدام اليومي."
    },
    {
      id: "dog-collar",
      name: "طوق الكلاب",
      category: "dogs",
      categoryName: "الكلاب",
      price: 30,
      icon: "🐕",
      description: "طوق عملي ومريح للمشي."
    },
    {
      id: "bird-food",
      name: "طعام الطيور",
      category: "birds",
      categoryName: "الطيور",
      price: 25,
      icon: "🐦",
      description: "غذاء مناسب للطيور المنزلية."
    },
    {
      id: "bird-cage",
      name: "قفص الطيور",
      category: "birds",
      categoryName: "الطيور",
      price: 120,
      icon: "🪶",
      description: "قفص عملي ومناسب لتربية الطيور."
    },
    {
      id: "small-food",
      name: "طعام الهامستر",
      category: "small",
      categoryName: "حيوانات صغيرة",
      price: 30,
      icon: "🐹",
      description: "طعام مناسب للهامستر والحيوانات الصغيرة."
    },
    {
      id: "small-accessories",
      name: "إكسسوارات الحيوانات الصغيرة",
      category: "small",
      categoryName: "حيوانات صغيرة",
      price: 40,
      icon: "🐹",
      description: "مستلزمات وإكسسوارات للحيوانات الصغيرة."
    },
    {
      id: "pet-bowl",
      name: "وعاء الطعام والماء",
      category: "accessories",
      categoryName: "إكسسوارات",
      price: 25,
      icon: "🍽️",
      description: "وعاء عملي للطعام أو الماء."
    },
    {
      id: "pet-brush",
      name: "فرشاة الحيوانات",
      category: "accessories",
      categoryName: "إكسسوارات",
      price: 28,
      icon: "🪮",
      description: "فرشاة للعناية بفرو الحيوان."
    }
  ];

  const openCartButton =
    document.getElementById("openCart");

  const closeCartButton =
    document.getElementById("closeCart");

  const cartModal =
    document.getElementById("cartModal");

  const cartItems =
    document.getElementById("cartItems");

  const cartEmpty =
    document.getElementById("cartEmpty");

  const cartSummary =
    document.getElementById("cartSummary");

  const cartTotal =
    document.getElementById("cartTotal");

  const cartCount =
    document.getElementById("cartCount");

  const whatsappOrder =
    document.getElementById("whatsappOrder");

  const checkoutForm =
    document.getElementById("checkoutForm");

  const productSearch =
    document.getElementById("productSearch");

  const categoryFilter =
    document.getElementById("categoryFilter");

  const productsGrid =
    document.getElementById("productsGrid");

  const noResults =
    document.getElementById("noResults");

  const currentYear =
    document.getElementById("currentYear");

  const cookieNotice =
    document.getElementById("cookieNotice");

  const acceptCookies =
    document.getElementById("acceptCookies");

  const rejectCookies =
    document.getElementById("rejectCookies");

  let cart = [];

  try {
    const saved =
      JSON.parse(
        localStorage.getItem("pawcasa_cart") || "[]"
      );

    if (Array.isArray(saved)) {
      cart = saved.filter(function (item) {
        return (
          item &&
          typeof item.id !== "undefined" &&
          typeof item.name === "string" &&
          Number.isFinite(Number(item.price)) &&
          Number(item.quantity) > 0
        );
      }).map(function (item) {
        return {
          id: String(item.id),
          name: String(item.name),
          price: Number(item.price),
          icon: item.icon || "🐾",
          quantity: Math.max(1, Number(item.quantity))
        };
      });
    }
  } catch (error) {
    cart = [];
  }

  function saveCart() {
    try {
      localStorage.setItem(
        "pawcasa_cart",
        JSON.stringify(cart)
      );
    } catch (error) {
      console.warn("تعذر حفظ السلة.");
    }
  }

  function formatPrice(value) {
    return (
      Number(value || 0).toLocaleString("ar-MA") +
      " درهم"
    );
  }

  function getCartCount() {
    return cart.reduce(function (total, item) {
      return total + Number(item.quantity);
    }, 0);
  }

  function getCartTotal() {
    return cart.reduce(function (total, item) {
      return total +
        Number(item.price) *
        Number(item.quantity);
    }, 0);
  }

  function escapeHTML(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function updateCartCount() {
    cartCount.textContent =
      String(getCartCount());
  }

  function renderProducts() {

    const search =
      productSearch.value
        .trim()
        .toLowerCase();

    const category =
      categoryFilter.value;

    productsGrid.innerHTML = "";

    let visibleCount = 0;

    products.forEach(function (product) {

      const matchesSearch =
        !search ||
        product.name
          .toLowerCase()
          .includes(search) ||
        product.categoryName
          .toLowerCase()
          .includes(search);

      const matchesCategory =
        category === "all" ||
        product.category === category;

      if (!matchesSearch || !matchesCategory) {
        return;
      }

      visibleCount++;

      const card =
        document.createElement("article");

      card.className = "product-card";

      card.innerHTML = `
        <div class="product-image"
             aria-label="${escapeHTML(product.name)}">
          ${escapeHTML(product.icon)}
        </div>

        <div class="product-info">

          <span class="product-category">
            ${escapeHTML(product.categoryName)}
          </span>

          <h3 class="product-title">
            ${escapeHTML(product.name)}
          </h3>

          <p class="product-description">
            ${escapeHTML(product.description)}
          </p>

          <div class="product-bottom">

            <span class="product-price">
              ${formatPrice(product.price)}
            </span>

            <button
              type="button"
              class="add-cart"
              data-product-id="${escapeHTML(product.id)}"
            >
              🛒 أضف للسلة
            </button>

          </div>

        </div>
      `;

      productsGrid.appendChild(card);
    });

    noResults.style.display =
      visibleCount === 0 ? "block" : "none";
  }

  function renderCart() {

    cartItems.innerHTML = "";

    if (cart.length === 0) {

      cartEmpty.style.display = "block";
      cartSummary.style.display = "none";
      return;
    }

    cartEmpty.style.display = "none";
    cartSummary.style.display = "block";

    cart.forEach(function (item) {

      const row =
        document.createElement("div");

      row.className = "cart-item";

      row.innerHTML = `
        <div class="cart-item-icon">
          ${escapeHTML(item.icon)}
        </div>

        <div class="cart-item-info">

          <div class="cart-item-name">
            ${escapeHTML(item.name)}
          </div>

          <div class="cart-item-price">
            ${formatPrice(item.price)}
          </div>

        </div>

        <div class="cart-quantity">

          <button
            type="button"
            class="quantity-btn"
            data-action="decrease"
            data-id="${escapeHTML(item.id)}"
          >
            −
          </button>

          <strong>
            ${item.quantity}
          </strong>

          <button
            type="button"
            class="quantity-btn"
            data-action="increase"
            data-id="${escapeHTML(item.id)}"
          >
            +
          </button>

        </div>

        <button
          type="button"
          class="remove-item"
          data-action="remove"
          data-id="${escapeHTML(item.id)}"
          aria-label="حذف ${escapeHTML(item.name)}"
        >
          🗑️
        </button>
      `;

      cartItems.appendChild(row);
    });

    cartTotal.textContent =
      formatPrice(getCartTotal());
  }

  function openCart() {

    renderCart();

    cartModal.classList.add("active");

    cartModal.setAttribute(
      "aria-hidden",
      "false"
    );

    document.body.classList.add("modal-open");
  }

  function closeCart() {

    cartModal.classList.remove("active");

    cartModal.setAttribute(
      "aria-hidden",
      "true"
    );

    document.body.classList.remove("modal-open");
  }

  function addToCart(product) {

    const existing =
      cart.find(function (item) {
        return item.id === product.id;
      });

    if (existing) {
      existing.quantity += 1;
    } else {
      cart.push({
        id: product.id,
        name: product.name,
        price: product.price,
        icon: product.icon,
        quantity: 1
      });
    }

    saveCart();
    updateCartCount();
    renderCart();
    openCart();
  }

  openCartButton.addEventListener(
    "click",
    function (event) {
      event.preventDefault();
      openCart();
    }
  );

  closeCartButton.addEventListener(
    "click",
    function () {
      closeCart();
    }
  );

  cartModal.addEventListener(
    "click",
    function (event) {

      if (event.target === cartModal) {
        closeCart();
      }
    }
  );

  productsGrid.addEventListener(
    "click",
    function (event) {

      const button =
        event.target.closest(".add-cart");

      if (!button) {
        return;
      }

      const productId =
        button.getAttribute("data-product-id");

      const product =
        products.find(function (item) {
          return item.id === productId;
        });

      if (product) {
        addToCart(product);
      }
    }
  );

  cartItems.addEventListener(
    "click",
    function (event) {

      const button =
        event.target.closest("[data-action]");

      if (!button) {
        return;
      }

      const action =
        button.getAttribute("data-action");

      const id =
        button.getAttribute("data-id");

      const item =
        cart.find(function (product) {
          return product.id === id;
        });

      if (action === "increase" && item) {
        item.quantity += 1;
      }

      if (action === "decrease" && item) {
        item.quantity -= 1;

        if (item.quantity <= 0) {
          cart = cart.filter(function (product) {
            return product.id !== id;
          });
        }
      }

      if (action === "remove") {
        cart = cart.filter(function (product) {
          return product.id !== id;
        });
      }

      saveCart();
      updateCartCount();
      renderCart();
    }
  );

  function filterProducts() {
    renderProducts();
  }

  productSearch.addEventListener(
    "input",
    filterProducts
  );

  categoryFilter.addEventListener(
    "change",
    filterProducts
  );

  checkoutForm.addEventListener(
    "submit",
    function (event) {

      event.preventDefault();

      if (cart.length === 0) {
        alert("السلة فارغة. أضف منتجًا أولًا.");
        return;
      }

      const customerName =
        document.getElementById("customerName")
          .value.trim();

      const customerPhone =
        document.getElementById("customerPhone")
          .value.trim();

      const customerAddress =
        document.getElementById("customerAddress")
          .value.trim();

      const customerNote =
        document.getElementById("customerNote")
          .value.trim();

      if (
        !customerName ||
        !customerPhone ||
        !customerAddress
      ) {
        alert(
          "يرجى إدخال الاسم ورقم الهاتف والعنوان."
        );
        return;
      }

      let message =
        "🐾 طلب جديد من PawCasa\n\n";

      message +=
        "👤 الاسم: " +
        customerName +
        "\n";

      message +=
        "📞 الهاتف: " +
        customerPhone +
        "\n";

      message +=
        "📍 العنوان: " +
        customerAddress +
        "\n\n";

      message +=
        "🛍️ المنتجات:\n";

      cart.forEach(function (item, index) {

        const subtotal =
          Number(item.price) *
          Number(item.quantity);

        message +=
          (index + 1) +
          ". " +
          item.name +
          " × " +
          item.quantity +
          " = " +
          subtotal +
          " درهم\n";
      });

      message +=
        "\n💰 المجموع: " +
        getCartTotal() +
        " درهم";

      if (customerNote) {
        message +=
          "\n\n📝 ملاحظة: " +
          customerNote;
      }

      const whatsappURL =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);

      window.location.href =
        whatsappURL;
    }
  );

  document.addEventListener(
    "keydown",
    function (event) {

      if (event.key === "Escape") {
        closeCart();
      }
    }
  );

  currentYear.textContent =
    new Date().getFullYear();

  function getCookieChoice() {

    try {
      return localStorage.getItem(
        "pawcasa_cookie_choice"
      );
    } catch (error) {
      return null;
    }
  }

  function saveCookieChoice(choice) {

    try {
      localStorage.setItem(
        "pawcasa_cookie_choice",
        choice
      );
    } catch (error) {}
  }

  if (!getCookieChoice()) {

    setTimeout(function () {
      cookieNotice.classList.add("show");
    }, 800);
  }

  acceptCookies.addEventListener(
    "click",
    function () {

      saveCookieChoice("accepted");

      cookieNotice.classList.remove("show");
    }
  );

  rejectCookies.addEventListener(
    "click",
    function () {

      saveCookieChoice("rejected");

      cookieNotice.classList.remove("show");
    }
  );

  renderProducts();
  renderCart();
  updateCartCount();

});

</script>
