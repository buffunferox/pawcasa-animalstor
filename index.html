<script>
/* =========================================================
   PawCasa - Main JavaScript - Fixed Version
   ========================================================= */

const WHATSAPP_NUMBER = "212684424055";

let cart = [];
let currentCategory = "all";
let toastTimer = null;


/* =========================================================
   Helpers
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}

function showToast(message) {
    const toast = $("toast");

    if (!toast) {
        alert(message);
        return;
    }

    toast.textContent = message;
    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 2500);
}

function escapeHtml(value) {
    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   CART - LOAD
   ========================================================= */

function loadCart() {
    try {
        const saved = localStorage.getItem("pawCasaCart");

        if (!saved) {
            cart = [];
            updateCart();
            return;
        }

        const data = JSON.parse(saved);

        if (!Array.isArray(data)) {
            cart = [];
            updateCart();
            return;
        }

        cart = data
            .filter(item =>
                item &&
                typeof item.name === "string" &&
                Number.isFinite(Number(item.price))
            )
            .map(item => ({
                name: item.name,
                price: Number(item.price),
                qty: Math.max(1, Number(item.qty) || 1)
            }));

    } catch (error) {
        console.error("Cart loading error:", error);
        cart = [];
    }

    updateCart();
}


/* =========================================================
   CART - SAVE
   ========================================================= */

function saveCart() {
    try {
        localStorage.setItem(
            "pawCasaCart",
            JSON.stringify(cart)
        );
    } catch (error) {
        console.error("Cart saving error:", error);
    }
}


/* =========================================================
   ADD TO CART
   ========================================================= */

function add(name, price) {

    name = String(name || "").trim();
    price = Number(price);

    if (!name) {
        showToast("اسم المنتج غير صحيح.");
        return;
    }

    if (!Number.isFinite(price)) {
        showToast("سعر المنتج غير صحيح.");
        return;
    }

    const existing = cart.find(
        item => item.name === name
    );

    if (existing) {
        existing.qty += 1;
    } else {
        cart.push({
            name: name,
            price: price,
            qty: 1
        });
    }

    saveCart();
    updateCart();

    showToast("تمت إضافة المنتج إلى السلة 🛒");
}


/* =========================================================
   UPDATE CART
   ========================================================= */

function updateCart() {

    const count = $("count");
    const cartItems = $("cartItems");
    const total = $("total");

    const totalItems = cart.reduce(
        (sum, item) => sum + item.qty,
        0
    );

    const totalPrice = cart.reduce(
        (sum, item) =>
            sum + (item.price * item.qty),
        0
    );

    if (count) {
        count.textContent = totalItems;
    }

    if (total) {
        total.textContent = Math.round(totalPrice);
    }

    if (!cartItems) {
        return;
    }

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="small-note">
                السلة فارغة حاليًا.
            </div>
        `;
        return;
    }

    cartItems.innerHTML = cart.map(
        (item, index) => `
            <div class="cartrow">

                <div>
                    <strong>
                        ${escapeHtml(item.name)}
                    </strong>

                    <br>

                    <span class="small-note">
                        ${item.price} درهم × ${item.qty}
                    </span>
                </div>

                <div class="qty">

                    <button
                        type="button"
                        onclick="changeQty(${index}, -1)">
                        −
                    </button>

                    <span>${item.qty}</span>

                    <button
                        type="button"
                        onclick="changeQty(${index}, 1)">
                        +
                    </button>

                </div>

            </div>
        `
    ).join("");
}


/* =========================================================
   CHANGE QUANTITY
   ========================================================= */

function changeQty(index, amount) {

    if (!cart[index]) {
        return;
    }

    cart[index].qty += Number(amount);

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    }

    saveCart();
    updateCart();
}


/* =========================================================
   CLEAR CART
   ========================================================= */

function clearCart() {

    if (cart.length === 0) {
        showToast("السلة فارغة بالفعل.");
        return;
    }

    cart = [];

    saveCart();
    updateCart();

    showToast("تم تفريغ السلة.");
}


/* =========================================================
   OPEN CART
   ========================================================= */

function openCart() {

    updateCart();

    const modal = $("cartModal");

    if (!modal) {
        showToast("تعذر فتح السلة.");
        return;
    }

    modal.style.display = "flex";
}


/* =========================================================
   CLOSE CART
   ========================================================= */

function closeCart() {

    const modal = $("cartModal");

    if (modal) {
        modal.style.display = "none";
    }
}


/* =========================================================
   OPEN CHECKOUT
   ========================================================= */

function openCheckout() {

    if (cart.length === 0) {
        showToast("السلة فارغة. أضف منتجًا أولًا.");
        return;
    }

    updateCheckoutSummary();
    closeCart();

    const modal = $("checkoutModal");

    if (modal) {
        modal.style.display = "flex";
    }
}


/* =========================================================
   CLOSE CHECKOUT
   ========================================================= */

function closeCheckout() {

    const modal = $("checkoutModal");

    if (modal) {
        modal.style.display = "none";
    }
}


/* =========================================================
   CHECKOUT SUMMARY
   ========================================================= */

function updateCheckoutSummary() {

    const summary = $("checkoutSummary");

    if (!summary) {
        return;
    }

    const total = cart.reduce(
        (sum, item) =>
            sum + item.price * item.qty,
        0
    );

    summary.innerHTML = `
        <strong>ملخص الطلب</strong>

        <br><br>

        ${cart.map(item => `
            <div>
                ${escapeHtml(item.name)}
                × ${item.qty}
                — ${item.price * item.qty} درهم
            </div>
        `).join("")}

        <hr>

        <strong>
            الإجمالي: ${total} درهم
        </strong>
    `;
}


/* =========================================================
   WHATSAPP ORDER
   ========================================================= */

function sendOrder() {

    if (cart.length === 0) {
        showToast("السلة فارغة.");
        return;
    }

    const nameEl = $("customerName");
    const phoneEl = $("customerPhone");
    const cityEl = $("customerCity");
    const addressEl = $("customerAddress");
    const paymentEl = $("paymentMethod");
    const consentEl = $("privacyConsent");

    if (!nameEl || !phoneEl || !cityEl || !addressEl) {
        showToast("نموذج الطلب غير مكتمل.");
        return;
    }

    const name = nameEl.value.trim();
    const phone = phoneEl.value.trim();
    const city = cityEl.value.trim();
    const address = addressEl.value.trim();

    const payment = paymentEl
        ? paymentEl.value
        : "الدفع عند الاستلام";

    if (!name) {
        showToast("اكتب اسمك.");
        nameEl.focus();
        return;
    }

    if (!phone) {
        showToast("اكتب رقم الهاتف.");
        phoneEl.focus();
        return;
    }

    /*
       أرقام المغرب المقبولة:

       0612345678
       0712345678
       +212612345678
       +212712345678
       212612345678
       212712345678
    */

    const cleanPhone = phone
        .replace(/\s+/g, "")
        .replace(/-/g, "");

    const validMoroccanPhone =
        /^(0[67]\d{8}|\+212[67]\d{8}|212[67]\d{8})$/;

    if (!validMoroccanPhone.test(cleanPhone)) {
        showToast("أدخل رقم هاتف مغربي صحيح.");
        phoneEl.focus();
        return;
    }

    if (!city) {
        showToast("اكتب المدينة.");
        cityEl.focus();
        return;
    }

    if (!address) {
        showToast("اكتب عنوان التوصيل.");
        addressEl.focus();
        return;
    }

    if (consentEl && !consentEl.checked) {
        showToast("يجب الموافقة على الشروط.");
        return;
    }


    /* =========================
       PRODUCTS
       ========================= */

    const productsText = cart.map(item => {
        return (
            "• " +
            item.name +
            " × " +
            item.qty +
            " = " +
            (item.price * item.qty) +
            " درهم"
        );
    }).join("\n");


    /* =========================
       TOTAL
       ========================= */

    const total = cart.reduce(
        (sum, item) =>
            sum + item.price * item.qty,
        0
    );


    /* =========================
       MESSAGE
       ========================= */

    const message =
`🐾 طلب جديد من PawCasa

👤 الاسم: ${name}
📞 الهاتف: ${phone}
📍 المدينة: ${city}
🏠 العنوان: ${address}
💳 طريقة الدفع: ${payment}

🛒 المنتجات:
${productsText}

💰 الإجمالي: ${total} درهم`;


    /* =========================
       WHATSAPP URL
       ========================= */

    const whatsappUrl =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(message);


    /*
       استخدام location.href يعمل
       على Android و iPhone والكمبيوتر.
    */

    window.location.href = whatsappUrl;
}


/* =========================================================
   SEARCH
   ========================================================= */

function searchProducts() {

    const input = $("searchBox");

    if (!input) {
        return;
    }

    const query =
        input.value
            .trim()
            .toLowerCase();

    document
        .querySelectorAll(".product")
        .forEach(product => {

            const text =
                product.textContent
                    .toLowerCase();

            const categoryOK =
                currentCategory === "all" ||
                product.classList.contains(
                    currentCategory
                );

            const searchOK =
                !query ||
                text.includes(query);

            product.style.display =
                categoryOK && searchOK
                    ? ""
                    : "none";
        });
}


/* =========================================================
   FILTER
   ========================================================= */

function filterProducts(category, button) {

    currentCategory = category || "all";

    document
        .querySelectorAll(".filter")
        .forEach(item => {
            item.classList.remove("active");
        });

    if (button) {
        button.classList.add("active");
    }

    searchProducts();
}


/* =========================================================
   CATEGORY
   ========================================================= */

function activateCategory(category) {

    currentCategory = category;

    const buttons =
        document.querySelectorAll(".filter");

    buttons.forEach(button => {

        const onclick =
            button.getAttribute("onclick") || "";

        button.classList.toggle(
            "active",
            onclick.includes("'" + category + "'")
        );
    });

    searchProducts();

    const products = $("products");

    if (products) {
        products.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}


/* =========================================================
   SORT
   ========================================================= */

function sortProducts() {

    const sortBox = $("sortBox");

    if (!sortBox) {
        return;
    }

    const mode = sortBox.value;

    document
        .querySelectorAll(".grid")
        .forEach(grid => {

            const products =
                Array.from(
                    grid.querySelectorAll(".product")
                );

            if (mode === "low") {

                products.sort(
                    (a, b) =>
                        getPrice(a) -
                        getPrice(b)
                );

            } else if (mode === "high") {

                products.sort(
                    (a, b) =>
                        getPrice(b) -
                        getPrice(a)
                );

            } else if (mode === "rating") {

                products.sort(
                    (a, b) =>
                        getRating(b) -
                        getRating(a)
                );
            }

            products.forEach(product => {
                grid.appendChild(product);
            });
        });

    searchProducts();
}


function getPrice(product) {

    const element =
        product.querySelector(".price");

    if (!element) {
        return 0;
    }

    const value =
        parseFloat(
            element.textContent
                .replace(/[^\d.]/g, "")
        );

    return Number.isFinite(value)
        ? value
        : 0;
}


function getRating(product) {

    const element =
        product.querySelector(".rating");

    if (!element) {
        return 0;
    }

    return (
        element.textContent.match(/★/g) || []
    ).length;
}


/* =========================================================
   DARK MODE
   ========================================================= */

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    try {
        localStorage.setItem(
            "pawCasaDark",
            dark ? "1" : "0"
        );
    } catch (error) {
        console.warn(error);
    }
}


function loadTheme() {

    try {

        if (
            localStorage.getItem("pawCasaDark") === "1"
        ) {
            document.body.classList.add("dark");
        }

    } catch (error) {
        console.warn(error);
    }
}


/* =========================================================
   MEDIA / PRODUCT IMAGE
   ========================================================= */

function openMedia(button) {

    if (!button) {
        return;
    }

    const url =
        button.dataset.media;

    if (!url) {
        showToast("لا توجد صورة لهذا المنتج.");
        return;
    }

    const modal = $("mediaModal");
    const image = $("mediaImage");
    const caption = $("mediaCaption");

    if (!modal || !image) {
        return;
    }

    image.src = url;

    image.alt = "صورة المنتج";

    if (caption) {

        const card =
            button.closest(".card");

        const title =
            card
                ? card.querySelector("h3")
                : null;

        caption.textContent =
            title
                ? title.textContent.trim()
                : "صورة المنتج";
    }

    modal.style.display = "flex";
}


function closeMedia() {

    const modal = $("mediaModal");

    if (modal) {
        modal.style.display = "none";
    }

    const image = $("mediaImage");

    if (image) {
        image.src = "";
    }
}


/* =========================================================
   CLOSE MODALS WHEN CLICKING OUTSIDE
   ========================================================= */

window.addEventListener("click", event => {

    const cartModal = $("cartModal");
    const checkoutModal = $("checkoutModal");
    const mediaModal = $("mediaModal");

    if (
        cartModal &&
        event.target === cartModal
    ) {
        closeCart();
    }

    if (
        checkoutModal &&
        event.target === checkoutModal
    ) {
        closeCheckout();
    }

    if (
        mediaModal &&
        event.target === mediaModal
    ) {
        closeMedia();
    }
});


/* =========================================================
   ESC KEY
   ========================================================= */

window.addEventListener("keydown", event => {

    if (event.key !== "Escape") {
        return;
    }

    closeCart();
    closeCheckout();
    closeMedia();
});


/* =========================================================
   INITIALIZATION
   ========================================================= */

document.addEventListener(
    "DOMContentLoaded",
    () => {

        loadCart();
        loadTheme();
        searchProducts();

        console.log(
            "PawCasa JavaScript loaded successfully."
        );
    }
);


/* =========================================================
   GLOBAL SAFETY
   ========================================================= */

window.add = add;
window.changeQty = changeQty;
window.clearCart = clearCart;

window.openCart = openCart;
window.closeCart = closeCart;

window.openCheckout = openCheckout;
window.closeCheckout = closeCheckout;

window.sendOrder = sendOrder;

window.searchProducts = searchProducts;
window.filterProducts = filterProducts;
window.activateCategory = activateCategory;
window.sortProducts = sortProducts;

window.toggleTheme = toggleTheme;

window.openMedia = openMedia;
window.closeMedia = closeMedia;

</script>
