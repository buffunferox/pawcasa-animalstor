<script>
"use strict";

/* =========================================================
   PawCasa - Main JavaScript
   Fixed & Clean Version
   ========================================================= */

const WHATSAPP_NUMBER = "212684424055";
const CART_STORAGE_KEY = "pawCasaCart";
const THEME_STORAGE_KEY = "pawCasaDark";

let cart = [];
let currentCategory = "all";
let toastTimer = null;


/* =========================================================
   HELPER
   ========================================================= */

function $(id) {
    return document.getElementById(id);
}


/* =========================================================
   SAFE NUMBER
   ========================================================= */

function safeNumber(value, fallback = 0) {
    const number = Number(value);

    return Number.isFinite(number)
        ? number
        : fallback;
}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(value) {
    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


/* =========================================================
   TOAST
   ========================================================= */

function showToast(message) {
    const toast = $("toast");

    if (!toast) {
        console.log(message);
        return;
    }

    toast.textContent = String(message);
    toast.style.display = "block";

    clearTimeout(toastTimer);

    toastTimer = setTimeout(() => {
        toast.style.display = "none";
    }, 2500);
}


/* =========================================================
   CART VALIDATION
   ========================================================= */

function normalizeCart(data) {
    if (!Array.isArray(data)) {
        return [];
    }

    return data
        .filter(item => {
            return (
                item &&
                typeof item.name === "string" &&
                item.name.trim() !== "" &&
                Number.isFinite(Number(item.price))
            );
        })
        .map(item => {
            return {
                name: item.name.trim(),
                price: Math.max(0, Number(item.price)),
                qty: Math.min(
                    99,
                    Math.max(
                        1,
                        Math.floor(
                            safeNumber(item.qty, 1)
                        )
                    )
                )
            };
        });
}


/* =========================================================
   LOAD CART
   ========================================================= */

function loadCart() {
    cart = [];

    try {
        const saved =
            localStorage.getItem(
                CART_STORAGE_KEY
            );

        if (saved) {
            cart = normalizeCart(
                JSON.parse(saved)
            );
        }

    } catch (error) {
        console.warn(
            "PawCasa: Cart loading error",
            error
        );

        cart = [];

        try {
            localStorage.removeItem(
                CART_STORAGE_KEY
            );
        } catch (_) {}
    }

    updateCart();
}


/* =========================================================
   SAVE CART
   ========================================================= */

function saveCart() {
    try {
        localStorage.setItem(
            CART_STORAGE_KEY,
            JSON.stringify(cart)
        );
    } catch (error) {
        console.warn(
            "PawCasa: Cart saving error",
            error
        );
    }
}


/* =========================================================
   ADD TO CART
   ========================================================= */

function add(name, price) {
    const productName =
        String(name ?? "").trim();

    const productPrice =
        Number(price);

    if (!productName) {
        showToast(
            "اسم المنتج غير صحيح."
        );
        return false;
    }

    if (
        !Number.isFinite(productPrice) ||
        productPrice < 0
    ) {
        showToast(
            "سعر المنتج غير صحيح."
        );
        return false;
    }

    const existing =
        cart.find(
            item =>
                item.name === productName
        );

    if (existing) {
        existing.qty = Math.min(
            99,
            existing.qty + 1
        );
    } else {
        cart.push({
            name: productName,
            price: productPrice,
            qty: 1
        });
    }

    saveCart();
    updateCart();

    showToast(
        "تمت إضافة المنتج إلى السلة 🛒"
    );

    return true;
}


/* =========================================================
   UPDATE CART
   ========================================================= */

function updateCart() {
    const count = $("count");
    const cartItems = $("cartItems");
    const total = $("total");

    const totalItems =
        cart.reduce(
            (sum, item) =>
                sum + item.qty,
            0
        );

    const totalPrice =
        cart.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.qty,
            0
        );

    if (count) {
        count.textContent =
            String(totalItems);
    }

    if (total) {
        total.textContent =
            String(Math.round(totalPrice));
    }

    if (!cartItems) {
        return;
    }

    if (cart.length === 0) {
        cartItems.innerHTML = `
            <div class="small-note">
                🛒 السلة فارغة حاليًا.
            </div>
        `;
        return;
    }

    cartItems.innerHTML =
        cart.map((item, index) => {

            const itemTotal =
                item.price * item.qty;

            return `
                <div class="cartrow">

                    <div>
                        <strong>
                            ${escapeHtml(item.name)}
                        </strong>

                        <br>

                        <span class="small-note">
                            ${item.price} درهم × ${item.qty}
                            = ${itemTotal} درهم
                        </span>
                    </div>

                    <div class="qty">

                        <button
                            type="button"
                            onclick="changeQty(${index}, -1)"
                            aria-label="إنقاص الكمية">
                            −
                        </button>

                        <span>
                            ${item.qty}
                        </span>

                        <button
                            type="button"
                            onclick="changeQty(${index}, 1)"
                            aria-label="زيادة الكمية">
                            +
                        </button>

                    </div>

                </div>
            `;
        }).join("");
}


/* =========================================================
   CHANGE QUANTITY
   ========================================================= */

function changeQty(index, amount) {
    if (!cart[index]) {
        return;
    }

    const change =
        Math.trunc(
            safeNumber(amount, 0)
        );

    if (!change) {
        return;
    }

    cart[index].qty += change;

    if (cart[index].qty <= 0) {
        cart.splice(index, 1);
    } else {
        cart[index].qty =
            Math.min(
                99,
                cart[index].qty
            );
    }

    saveCart();
    updateCart();
}


/* =========================================================
   CLEAR CART
   ========================================================= */

function clearCart() {
    if (cart.length === 0) {
        showToast(
            "السلة فارغة بالفعل."
        );
        return;
    }

    cart = [];

    saveCart();
    updateCart();

    showToast(
        "تم تفريغ السلة."
    );
}


/* =========================================================
   OPEN CART
   ========================================================= */

function openCart() {
    updateCart();

    const modal =
        $("cartModal");

    if (!modal) {
        console.error(
            "PawCasa: cartModal غير موجود في HTML."
        );

        showToast(
            "تعذر فتح السلة."
        );

        return;
    }

    modal.style.display = "flex";

    document.body.classList.add(
        "modal-open"
    );
}


/* =========================================================
   CLOSE CART
   ========================================================= */

function closeCart() {
    const modal =
        $("cartModal");

    if (modal) {
        modal.style.display = "none";
    }

    document.body.classList.remove(
        "modal-open"
    );
}


/* =========================================================
   OPEN CHECKOUT
   ========================================================= */

function openCheckout() {
    if (cart.length === 0) {
        showToast(
            "السلة فارغة. أضف منتجًا أولًا."
        );
        return;
    }

    updateCheckoutSummary();
    closeCart();

    const modal =
        $("checkoutModal");

    if (!modal) {
        showToast(
            "نموذج الطلب غير موجود."
        );
        return;
    }

    modal.style.display = "flex";

    document.body.classList.add(
        "modal-open"
    );
}


/* =========================================================
   CLOSE CHECKOUT
   ========================================================= */

function closeCheckout() {
    const modal =
        $("checkoutModal");

    if (modal) {
        modal.style.display = "none";
    }

    document.body.classList.remove(
        "modal-open"
    );
}


/* =========================================================
   CHECKOUT SUMMARY
   ========================================================= */

function updateCheckoutSummary() {
    const summary =
        $("checkoutSummary");

    if (!summary) {
        return;
    }

    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.qty,
            0
        );

    summary.innerHTML = `
        <strong>🛒 ملخص الطلب</strong>

        <br><br>

        ${cart.map(item => `
            <div>
                ${escapeHtml(item.name)}
                × ${item.qty}
                —
                ${item.price * item.qty}
                درهم
            </div>
        `).join("")}

        <hr>

        <strong>
            💰 الإجمالي:
            ${Math.round(total)}
            درهم
        </strong>
    `;
}


/* =========================================================
   NORMALIZE MOROCCAN PHONE
   ========================================================= */

function normalizeMoroccanPhone(phone) {
    const value =
        String(phone ?? "")
            .trim()
            .replace(/[\s()-]/g, "");

    if (/^0[67]\d{8}$/.test(value)) {
        return "212" +
            value.substring(1);
    }

    if (/^\+212[67]\d{8}$/.test(value)) {
        return value.substring(1);
    }

    if (/^212[67]\d{8}$/.test(value)) {
        return value;
    }

    return null;
}


/* =========================================================
   SEND ORDER
   ========================================================= */

function sendOrder() {
    if (cart.length === 0) {
        showToast("السلة فارغة.");
        return;
    }

    const nameEl =
        $("customerName");

    const phoneEl =
        $("customerPhone");

    const cityEl =
        $("customerCity");

    const addressEl =
        $("customerAddress");

    const paymentEl =
        $("paymentMethod");

    const consentEl =
        $("privacyConsent");

    if (
        !nameEl ||
        !phoneEl ||
        !cityEl ||
        !addressEl
    ) {
        console.error(
            "PawCasa: عناصر نموذج الطلب ناقصة."
        );

        showToast(
            "نموذج الطلب غير مكتمل."
        );

        return;
    }

    const name =
        nameEl.value.trim();

    const phone =
        phoneEl.value.trim();

    const city =
        cityEl.value.trim();

    const address =
        addressEl.value.trim();

    const payment =
        paymentEl
            ? paymentEl.value
            : "الدفع عند الاستلام";

    if (!name) {
        showToast("اكتب اسمك.");
        nameEl.focus();
        return;
    }

    const normalizedPhone =
        normalizeMoroccanPhone(phone);

    if (!normalizedPhone) {
        showToast(
            "أدخل رقم هاتف مغربي صحيح."
        );
        phoneEl.focus();
        return;
    }

    if (!city) {
        showToast("اكتب المدينة.");
        cityEl.focus();
        return;
    }

    if (!address) {
        showToast(
            "اكتب عنوان التوصيل."
        );
        addressEl.focus();
        return;
    }

    if (
        consentEl &&
        !consentEl.checked
    ) {
        showToast(
            "يجب الموافقة على الشروط."
        );
        consentEl.focus();
        return;
    }

    const productsText =
        cart.map(item =>
            "• " +
            item.name +
            " × " +
            item.qty +
            " = " +
            (
                item.price *
                item.qty
            ) +
            " درهم"
        ).join("\n");

    const total =
        cart.reduce(
            (sum, item) =>
                sum +
                item.price *
                item.qty,
            0
        );

    const message =
`🐾 طلب جديد من PawCasa

👤 الاسم: ${name}
📞 الهاتف: ${phone}
📍 المدينة: ${city}
🏠 العنوان: ${address}
💳 طريقة الدفع: ${payment}

🛒 المنتجات:
${productsText}

💰 الإجمالي: ${Math.round(total)} درهم`;

    const whatsappUrl =
        "https://wa.me/" +
        WHATSAPP_NUMBER +
        "?text=" +
        encodeURIComponent(
            message
        );

    window.location.href =
        whatsappUrl;
}


/* =========================================================
   SEARCH
   ========================================================= */

function searchProducts() {
    const input =
        $("searchBox");

    const query =
        input
            ? input.value
                .trim()
                .toLowerCase()
            : "";

    document
        .querySelectorAll(".product")
        .forEach(product => {

            const text =
                product.textContent
                    .toLowerCase();

            const categoryOK =
                currentCategory === "all" ||
                product.classList.contains(
                    currentCategory
                );

            const searchOK =
                !query ||
                text.includes(query);

            product.style.display =
                categoryOK &&
                searchOK
                    ? ""
                    : "none";
        });
}


/* =========================================================
   FILTER
   ========================================================= */

function filterProducts(
    category,
    button
) {
    currentCategory =
        category || "all";

    document
        .querySelectorAll(".filter")
        .forEach(item => {
            item.classList.remove(
                "active"
            );
        });

    if (button) {
        button.classList.add(
            "active"
        );
    }

    searchProducts();
}


/* =========================================================
   CATEGORY
   ========================================================= */

function activateCategory(category) {
    currentCategory =
        category || "all";

    searchProducts();

    const products =
        $("products");

    if (products) {
        products.scrollIntoView({
            behavior: "smooth",
            block: "start"
        });
    }
}


/* =========================================================
   SORT
   ========================================================= */

function sortProducts() {
    const sortBox =
        $("sortBox");

    if (!sortBox) {
        return;
    }

    const mode =
        sortBox.value;

    document
        .querySelectorAll(".grid")
        .forEach(grid => {

            const products =
                Array.from(
                    grid.querySelectorAll(
                        ".product"
                    )
                );

            if (mode === "low") {

                products.sort(
                    (a, b) =>
                        getPrice(a) -
                        getPrice(b)
                );

            } else if (mode === "high") {

                products.sort(
                    (a, b) =>
                        getPrice(b) -
                        getPrice(a)
                );

            } else if (mode === "rating") {

                products.sort(
                    (a, b) =>
                        getRating(b) -
                        getRating(a)
                );
            }

            products.forEach(product => {
                grid.appendChild(product);
            });
        });

    searchProducts();
}


/* =========================================================
   PRICE
   ========================================================= */

function getPrice(product) {
    if (!product) {
        return 0;
    }

    const element =
        product.querySelector(
            ".price"
        );

    if (!element) {
        return 0;
    }

    const value =
        parseFloat(
            element.textContent
                .replace(/[^\d.,]/g, "")
                .replace(",", ".")
        );

    return Number.isFinite(value)
        ? value
        : 0;
}


/* =========================================================
   RATING
   ========================================================= */

function getRating(product) {
    if (!product) {
        return 0;
    }

    const element =
        product.querySelector(
            ".rating"
        );

    if (!element) {
        return 0;
    }

    return (
        element.textContent
            .match(/★/g) || []
    ).length;
}


/* =========================================================
   DARK MODE
   ========================================================= */

function toggleTheme() {
    document.body.classList.toggle(
        "dark"
    );

    const dark =
        document.body.classList.contains(
            "dark"
        );

    try {
        localStorage.setItem(
            THEME_STORAGE_KEY,
            dark ? "1" : "0"
        );
    } catch (error) {
        console.warn(error);
    }
}


/* =========================================================
   LOAD THEME
   ========================================================= */

function loadTheme() {
    try {
        if (
            localStorage.getItem(
                THEME_STORAGE_KEY
            ) === "1"
        ) {
            document.body.classList.add(
                "dark"
            );
        }
    } catch (error) {
        console.warn(error);
    }
}


/* =========================================================
   MEDIA
   ========================================================= */

function openMedia(button) {
    if (!button) {
        return;
    }

    const url =
        button.dataset
            ? button.dataset.media
            : "";

    if (!url) {
        showToast(
            "لا توجد صورة لهذا المنتج."
        );
        return;
    }

    const modal =
        $("mediaModal");

    const image =
        $("mediaImage");

    const caption =
        $("mediaCaption");

    if (!modal || !image) {
        showToast(
            "نافذة الصورة غير موجودة."
        );
        return;
    }

    image.src = url;
    image.alt = "صورة المنتج";

    if (caption) {
        const card =
            button.closest
